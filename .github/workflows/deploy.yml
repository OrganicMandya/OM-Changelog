name: deploy

# Auto-aggregate the org changelog into customer voice, render public/ from
# content.json, and deploy to OM-owned Cloudflare Pages (project: om-changelog).
# Replaces GitHub Pages so the changelog runs on the standard OM stack (Cloudflare
# + Terraform), alongside OM-Insights. The Pages project + custom domain are
# managed in OM-Infra stacks/om-changelog.
#
# aggregate.py (OM-Infra#86) rebuilds content.json from every product repo's
# changelog.d fragments + releases, rewritten to customer voice by an OpenAI model.
# It is FAIL-OPEN: without om/openai-api-key in the vault it leaves content.json
# untouched, so the page keeps deploying either way. See AGGREGATION.md.
#
# NO GitHub-stored secrets: the Cloudflare token, the OpenAI key and the
# cross-repo GitHub read token all live in the OM vault (AWS Secrets Manager,
# om/*) and are read via OIDC — the org-wide reader role
# github-actions-secrets-reader (trusts repo:OrganicMandya/*) can read om/*.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1" # Mon 00:30 UTC ≈ 06:00 IST — page is fresh first thing Monday morning
  repository_dispatch:
    types: [changelog-refresh] # #85 cut-release can refresh the page on a release
  push:
    branches: [main]
    paths: [content.json, generate.py, aggregate.py, .github/workflows/deploy.yml]

concurrency:
  group: deploy-changelog
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # assume the AWS reader role via OIDC (no stored AWS/CF keys)

jobs:
  deploy:
    name: aggregate + render + deploy → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuse the OM vault via OIDC — no GitHub secrets. Same reader role the
      # OM-Infra terraform workflow and OM-Insights deploy use.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492023123:role/github-actions-secrets-reader
          aws-region: ap-south-1

      - name: Load secrets from vault
        run: |
          CF="$(aws secretsmanager get-secret-value --secret-id om/cloudflare-api-token --query SecretString --output text)"
          echo "::add-mask::$CF"
          echo "CLOUDFLARE_API_TOKEN=$CF" >> "$GITHUB_ENV"
          # Optional — auto-aggregation. Absent until provisioned; never fail the deploy.
          if AK="$(aws secretsmanager get-secret-value --secret-id om/openai-api-key --query SecretString --output text 2>/dev/null)"; then
            echo "::add-mask::$AK"; echo "OPENAI_API_KEY=$AK" >> "$GITHUB_ENV"
          else
            echo "note: om/openai-api-key not in vault yet — auto-aggregation inactive (page keeps its curated content.json)."
          fi
          if GH="$(aws secretsmanager get-secret-value --secret-id om/github-changelog-reader --query SecretString --output text 2>/dev/null)"; then
            echo "::add-mask::$GH"; echo "OM_GH_TOKEN=$GH" >> "$GITHUB_ENV"
          fi

      - name: Install aggregator deps
        run: pip install --quiet openai

      # Rebuild content.json from org changelog fragments + releases (fail-open).
      # Falls back to the workflow token for public-repo reads if no vault token.
      - name: Auto-aggregate content.json from org changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python aggregate.py

      - name: Render the page from content.json
        run: python generate.py

      # The project (om-changelog) is created by OM-Infra stacks/om-changelog — apply that first.
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: e0ca7df3b3d7acdfc0e3056bc441fa33 # OM Cloudflare account — not secret
          command: pages deploy public --project-name=om-changelog --branch=main
