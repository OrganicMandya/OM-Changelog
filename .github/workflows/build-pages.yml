# Build + deploy the org changelog page (OM-Infra#86).
# Renders public/index.html from the curated content.json and publishes to GitHub Pages.
# No cross-repo access needed — the plain-language entries live in content.json in this repo.
# The weekly rebuild also re-groups entries by date (this week -> earlier) as time passes.
name: Build & deploy changelog page

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 3" # Wed 12:00 UTC — release-train day (re-groups by date)
  repository_dispatch:
    types: [changelog-refresh]
  push:
    branches: [main, master]
    paths: [content.json, generate.py, .github/workflows/build-pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the page from content.json
        run: python generate.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
